name: Deploy to Firebase Hosting on PR
'on': pull_request
env:
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  BLOG_DATABASE_ID: ${{ secrets.DATABASE_ID }}
  INDIE_DATABASE_ID: ${{ secrets.INDIE_DATABASE_ID }}
  ANIME_DATABASE_ID: ${{ secrets.ANIME_DATABASE_ID }}
  NEXT_PUBLIC_PUBLIC_STORAGE: ${{ secrets.PUBLIC_STORAGE }}
  NEXT_PUBLIC_GITHUB_ACCOUNT: ${{ secrets.NEXT_PUBLIC_GITHUB_ACCOUNT }}
  NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
  NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARU44 }}'
          projectId: ${{ vars.PROJECT_ID }}
